name: Daily AI Short

on:
  schedule:
    - cron: "0 15 * * *"   # runs daily at 15:00 UTC — edit to your preferred time
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab too

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      # Uncomment once you've set up OAuth (see README) and added
      # CLIENT_SECRET_JSON / TOKEN_JSON as repo secrets containing the
      # file contents, written out as files here before running with --upload.
      # - name: Run pipeline with upload
      #   run: python main.py --upload

      - name: Upload output as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output/*.mp4
