name: Daily AI Short

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: 'Describe the clip/topic for today'
        required: false
        default: ''
      script:
        description: 'Paste your finished script here (leave blank to auto-generate)'
        required: false
        default: ''

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
          MANUAL_SCRIPT: ${{ github.event.inputs.script }}
        run: python main.py

      - name: Upload output as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output/*.mp4
